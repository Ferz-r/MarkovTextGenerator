name: Publish Docker image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Serialize releases so simultaneous builds cannot race to update latest.
concurrency:
  group: dockerhub-publish
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out release source
        uses: actions/checkout@v6

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ferzr/markov_text_generator
          tags: |
            type=semver,pattern={{version}}

      - name: Validate release tag
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if [ -z "$IMAGE_TAGS" ]; then
            echo "Expected a semantic version tag such as v0.1.2 or v0.1.2-beta.1" >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish AMD64 and ARM64 images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
